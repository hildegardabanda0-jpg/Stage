<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">

</head>
<body>
    <div class="parent">
        <div class="contact">
            <section class="contact-section">
                <h1>Contac Us</h1>
                <p>We would love to here from you send us a message.</p>
            </section>
                <form>
                    <div class="name">
                        <label for="Name">Full Name:</label>
                        <input type="Text" id="name" name="name" required><br>
                    </div>
                    <div class="email">
                        <label for="Email">Full Email:</label>
                        <input type="Text" id="Email" Email="Email" required><br>
                    </div>
                    <div class="message">
                        <label for="Message">Full Message:</label>
                        <textarea id="Message" name="message" rows="5" required></textarea><br>
                    </div>
                    <button type="Submit">Send</button>

                </form>
                <hr>
                <h2>Contact Information</h2>
                <div class="p2">
                   <p><strong>Email:</strong>contact@example.com</p> 
                   <p><strong>Phone:</strong>+237 697465163</p>
                   <p><strong>Address:</strong>Yaounde, Cameroon</p>             
            </div>
    
        </div>
    </div>
    
</body>
</html>
